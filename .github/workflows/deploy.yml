name: Desplegar a panel.entraditas.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR || 'panel.entraditas.com/' }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el panel
        run: npm run build

      - name: Comprobar carpeta de destino
        run: |
          if [ -z "$FTP_REMOTE_DIR" ]; then
            echo "::error::No se pudo resolver FTP_REMOTE_DIR."
            exit 1
          fi
          echo "Destino FTP: $FTP_REMOTE_DIR"

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ env.FTP_REMOTE_DIR }}
